<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css?family=Ubuntu:300,400,700&amp;subset=cyrillic"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,700&amp;subset=cyrillic"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,700&amp;subset=cyrillic"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Playfair+Display:400,400i|Tinos:400,400i&amp;subset=cyrillic"
      rel="stylesheet"
    />
    <script src="scripts/index.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body,
      html {
        height: 100%;
        overflow: hidden;
      }
      body {
        position: relative;
        background-color: #000000;
        color: #ffffff;
        text-align: center;
        user-select: none;
      }
      h1 {
        font-family: "Playfair Display";
        padding: 10px 0px;
        margin: 0px;
      }
      .gameTitle {
        padding-top: 35px;
        font-size: 20px;
      }
      .field-box {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 2px solid #d0d0d0;
      }
      .field {
        position: relative;
        width: 1000px;
        height: 600px;
      }
      .field .tileB {
        position: absolute;
        width: 50px;
        height: 50px;
        background-size: 100%;
        background-image: url(/src/images/tile-B.png);
        z-index: 5;
      }
      .field .tileW {
        background-image: url(/src/images/tile-W.png);
      }
      .field .tileE {
        background-image: url(/src/images/tile-E.png);
        z-index: 10;
      }
      .field .tileP {
        background-image: url(/src/images/tile-P.png);
        z-index: 10;
      }
      .field .tileHP {
        background-image: url(/src/images/tile-HP.png);
        z-index: 9;
      }
      .field .tileSW {
        background-image: url(/src/images/tile-SW.png);
        z-index: 9;
      }
      .field .tile .health {
        background-color: #ff0000;
        z-index: 11;
        position: absolute;
        left: 0px;
        top: 0px;
        height: 3px;
      }
      .field .tileP .health {
        background-color: #00ff00;
        z-index: 11;
        position: absolute;
        left: 0px;
        top: 0px;
        height: 3px;
      }
      .inventory-box {
        border: 2px solid #d0d0d0;
        float: left;
      }
      .inventory {
        position: relative;
        width: 800px;
        height: 32px;
      }
      .cl {
        clear: both;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="gameTitle"><h1>Rogalik Game</h1></div>
    <div class="field-box">
      <div class="field" id="field"></div>
    </div>
    <div class="cl"></div>
    <!--h1>Инвентарь</h1>
		<div class="inventory-box"><div class="inventory"></div></div-->

    <script src="scripts/movement.js"></script>
    <script src="scripts/utils.js"></script>
    <script>
      var game = new App.Game();
      game.init();
    </script>
  </body>
</html>
